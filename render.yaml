databases:
  - name: ai-gaming-copilot-db
    databaseName: ai_gaming_copilot
    user: ai_gaming_user
    plan: free
    region: oregon

services:
  - type: web
    name: ai-gaming-copilot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-gaming-copilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: development
      - key: SECOND_BRAIN_URL
        value: https://ai-gaming-second.onrender.com

  - type: web
    name: ai-gaming-second-brain
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://ai-gaming-copilot.vercel.app
